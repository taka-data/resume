name: Build and Deploy Resume

on:
  push:
    branches: [main]
    paths:
      - readme.md
      - latex/**
      - .github/workflows/**
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc fonts-noto-cjk \
            texlive-xetex texlive-latex-extra texlive-fonts-extra latexmk
          pip install jinja2

      - name: Create output directory
        run: mkdir -p dist

      - name: Generate HTML page
        env:
          REPO: ${{ github.repository }}
        run: |
          pandoc readme.md --from markdown --to html5 -o /tmp/body.html
          PDF_URL="https://github.com/${REPO}/releases/latest/download/resume.pdf" \
            python3 .github/scripts/generate_html.py

      - name: Generate resume.tex from readme.md
        run: python3 .github/scripts/generate_tex.py

      - name: Compile resume PDF via XeLaTeX
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error \
            -auxdir=/tmp/latex-aux -outdir="$(pwd)/dist" -cd latex/resume.tex

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "最新版 職務経歴書"
          body: "職務経歴書のPDF版です。ボタンからダウンロードできます。"
          files: dist/resume.pdf
          make_latest: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
