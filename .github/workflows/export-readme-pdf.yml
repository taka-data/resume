name: Build and Deploy Resume

on:
  push:
    branches: [main]
    paths:
      - readme.md
      - .github/workflows/**
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: Create output directory
        run: mkdir -p dist

      - name: Generate HTML page
        env:
          REPO: ${{ github.repository }}
        run: |
          pandoc readme.md --from markdown --to html5 -o /tmp/body.html
          PDF_URL="https://github.com/${REPO}/releases/latest/download/resume.pdf" \
            python3 .github/scripts/generate_html.py

      - name: Generate PDF via headless Chrome
        run: |
          google-chrome-stable \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --run-all-compositor-stages-before-draw \
            --print-to-pdf="$(pwd)/dist/resume.pdf" \
            --no-pdf-header-footer \
            "file://$(pwd)/dist/index.html"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "最新版 職務経歴書"
          body: "職務経歴書のPDF版です。ボタンからダウンロードできます。"
          files: dist/resume.pdf
          make_latest: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
